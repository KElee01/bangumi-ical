name: Update and deploy calendar

on:
  push:
    branches: [main]     # 每次推送自动重新生成并部署
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00 = 北京时间 6:00
    - cron: "0 10 * * *"   # 每天 UTC 10:00 = 北京时间 18:00
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ICS
        run: python bangumi_calendar.py
        env:
          BANGUMI_UID: "463198"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # 包含 index.html 和 bangumi.ics

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
